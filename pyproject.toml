[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dedupfs"
version = "0.1.0"
description = "Content-aware deduplicating filesystem with an optional FUSE mount"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]
test = ["pytest>=8.0", "httpx2>=2.0.0"]

fuse = ["fusepy>=3.0.1"]

[project.scripts]
dedupfs = "dedupfs.cli:main"

[tool.setuptools]
packages = ["dedupfs", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
